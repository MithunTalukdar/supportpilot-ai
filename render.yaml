# ==============================================================================
# SupportPilot AI — Render.com Blueprint Specification (Infrastructure as Code)
# ==============================================================================

version: "1"

databases:
  - name: supportpilot-db
    databaseName: supportpilot_production
    user: supportpilot_user
    plan: starter
    postgresMajorVersion: 16
    region: oregon

services:
  # ----------------------------------------------------------------------------
  # Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: supportpilot-backend
    env: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: supportpilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        fromService:
          type: web
          name: supportpilot-frontend
          property: host
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: supportpilot-frontend
          property: host
      - key: COOKIE_SAME_SITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false # Set securely in Render dashboard

  # ----------------------------------------------------------------------------
  # Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: supportpilot-frontend
    env: static
    plan: starter
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: supportpilot-backend
          property: host
          path: /api
